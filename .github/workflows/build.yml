name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/fetch-ffmpeg.sh

      - name: Fetch ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package app
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pyinstaller build/whispered.spec --noconfirm

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Whispered-macos
          path: dist/Whispered.app
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Whispered-windows
          path: dist/Whispered
          if-no-files-found: error
