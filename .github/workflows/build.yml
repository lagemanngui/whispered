name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libcairo2-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            python3-dev \
            pkg-config

      - name: Fetch ffmpeg (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-ffmpeg.sh

      - name: Install pywebview GTK (Linux)
        if: runner.os == 'Linux'
        run: pip install 'pywebview[gtk]'

      - name: Fetch ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package app
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pyinstaller build/whispered.spec --noconfirm

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Whispered-macos
          path: dist/Whispered.app
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Whispered-windows
          path: dist/Whispered
          if-no-files-found: error

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Whispered-linux
          path: dist/Whispered
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Whispered-windows
          path: windows

      - uses: actions/download-artifact@v4
        with:
          name: Whispered-macos
          path: macos

      - uses: actions/download-artifact@v4
        with:
          name: Whispered-linux
          path: linux

      - name: Zip Windows build
        run: |
          (cd windows && zip -r "$GITHUB_WORKSPACE/Whispered-${{ github.ref_name }}-windows-x64.zip" .)

      - name: Zip macOS build
        run: |
          (cd macos && zip -ry "$GITHUB_WORKSPACE/Whispered-${{ github.ref_name }}-macos-arm64.zip" Whispered.app)

      - name: Zip Linux build
        run: |
          (cd linux && zip -r "$GITHUB_WORKSPACE/Whispered-${{ github.ref_name }}-linux-x64.zip" .)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Whispered-${{ github.ref_name }}-windows-x64.zip
            Whispered-${{ github.ref_name }}-macos-arm64.zip
            Whispered-${{ github.ref_name }}-linux-x64.zip
          generate_release_notes: true
