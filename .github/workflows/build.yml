name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Use CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: |
          pip uninstall -y torch torchvision torchaudio 2>/dev/null || true
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip list --format=freeze | grep -i '^nvidia-' | cut -d= -f1 | xargs -r pip uninstall -y

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libcairo2-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            python3-dev \
            pkg-config

      - name: Fetch ffmpeg (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-ffmpeg.sh

      - name: Install pywebview GTK (Linux)
        if: runner.os == 'Linux'
        run: pip install 'pywebview[gtk]'

      - name: Fetch ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package app
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pyinstaller build/whispered.spec --noconfirm

      - name: Prune Linux bundle
        if: runner.os == 'Linux'
        run: |
          ROOT="${{ github.workspace }}/dist/Whispered"
          echo "Bundle size before prune:"
          du -sh "$ROOT"
          find "$ROOT" -type d -name nvidia -prune -exec rm -rf {} +
          find "$ROOT" -name 'libtorch_cuda.so*' -delete
          find "$ROOT" -name '*cudnn*' -delete
          find "$ROOT" -path '*/torch/lib/libc10_cuda*' -delete
          echo "Bundle size after prune:"
          du -sh "$ROOT"

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Whispered-macos
          path: dist/
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Whispered-windows
          path: dist/Whispered
          if-no-files-found: error

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Whispered-linux
          path: dist/Whispered
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Whispered-windows
          path: windows

      - uses: actions/download-artifact@v4
        with:
          name: Whispered-macos
          path: macos

      - uses: actions/download-artifact@v4
        with:
          name: Whispered-linux
          path: linux

      - name: Zip Windows build
        run: |
          (cd windows && zip -9 -r "$GITHUB_WORKSPACE/Whispered-${{ github.ref_name }}-windows-x64.zip" .)

      - name: Zip macOS build
        run: |
          OUT="$GITHUB_WORKSPACE/Whispered-${{ github.ref_name }}-macos-arm64.zip"
          APP="$(find macos -maxdepth 4 -name 'Whispered.app' -type d | head -1)"
          if [ -z "$APP" ] && [ -d macos/Contents ]; then
            mkdir -p _pkg/Whispered.app
            shopt -s dotglob
            for f in macos/*; do
              [ "$f" != "_pkg" ] && mv "$f" _pkg/Whispered.app/
            done
            APP="_pkg/Whispered.app"
          fi
          if [ -z "$APP" ]; then
            echo "Whispered.app not found in macOS artifact"
            find macos | head -50
            exit 1
          fi
          PARENT="$(dirname "$APP")"
          (cd "$PARENT" && zip -9 -ry "$OUT" "$(basename "$APP")")

      - name: Zip Linux build
        run: |
          (cd linux && zip -9 -r "$GITHUB_WORKSPACE/Whispered-${{ github.ref_name }}-linux-x64.zip" .)

      - name: Verify release asset sizes
        run: |
          LIMIT=2147483648
          for f in Whispered-*.zip; do
            size=$(stat -c%s "$f")
            echo "$f: $(numfmt --to=iec-i --suffix=B "$size")"
            if [ "$size" -ge "$LIMIT" ]; then
              echo "::error::$f ($size bytes) exceeds GitHub's 2 GiB per-asset limit"
              exit 1
            fi
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Whispered-${{ github.ref_name }}-windows-x64.zip
            Whispered-${{ github.ref_name }}-macos-arm64.zip
            Whispered-${{ github.ref_name }}-linux-x64.zip
          generate_release_notes: true
